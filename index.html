<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const blank=()=>({xp:0,rw:{},log:[],goals:{},inc:{}});
let S;try{S=JSON.parse(localStorage.getItem('rewind.v1'))}catch(e){}
if(!S||typeof S!=='object')S={};S.main={...blank(),...(S.main||{})};S.demo={...blank(),...(S.demo||{})};S.p=S.p||{};S.stage=S.stage||0;
const save=()=>{try{localStorage.setItem('rewind.v1',JSON.stringify(S))}catch(e){}};
const st=()=>S.demoOn?S.demo:S.main;
function award(id,n){const s=st();if(s.rw[id])return 0;s.rw[id]=n;s.xp+=n;save();return n}
function rec(t,id,ok,x){st().log.push({t,id,ok,ts:Date.now(),...x});save()}
const keys=p=>Object.keys(st().rw).filter(k=>k.startsWith(p));
const fmt=ts=>new Date(ts).toLocaleString();
/* ---- Rescue engine (rule-based, deterministic; no AI) ---- */
const YN=['yes','no'];
const Q={money:[['status','Was the payment completed or pending?',['completed','pending']],['method','Which payment method was used?',['UPI','Card','Net banking','Other']],['recent','How recently did this happen?',['Within 1 hour','Within 24 hours','Longer ago']],['bank','Have you contacted your bank?',YN]],
otp:[['acct','Which account was the OTP for?',['Banking','Email','Social media']],['pw','Did you also share a password?',YN],['acc','Can you still access the account?',YN],['act','Have you noticed unfamiliar activity?',YN]],
link:[['entered','Did you enter any information on the page?',YN],['what','What kind of information?',['Bank/card details','Login details','Other'],a=>a.entered==='yes'],['dl','Did you download or install anything?',YN],['perm','Did you grant any permissions?',YN]],
crypto:[['how','How was the phrase exposed?',['Shared with someone','Entered on a website']],['acc','Is the wallet still accessible to you?',YN],['assets','Are assets still in the wallet?',YN]],
sim:[['lock','Was the phone protected by a screen lock?',YN],['apps','Does it have banking or payment apps?',YN],['blocked','Has the SIM already been blocked?',YN]],
hack:[['acc','Can you still log in?',YN],['fin','Is the account linked to payments or banking?',YN],['reuse','Do you reuse this password elsewhere?',YN]]};
const NAMES={money:'Money sent to a scammer',otp:'OTP or password shared',link:'Suspicious link clicked',crypto:'Recovery phrase exposed',sim:'Phone or SIM stolen',hack:'Account hacked'};
const WH={money:'You sent money to a suspected scammer.',otp:'You shared a one-time code or password.',link:'You clicked a suspicious link.',crypto:'Your wallet recovery phrase was exposed.',sim:'Your phone or SIM was lost or stolen.',hack:'Someone may have taken over an account.'};
const AL={bank:['Contact your bank or service','Call through the number on your card or the official app/site that you type yourself.','Banks can act fastest in the first hours.','Ask about blocking cards or freezing access.','Do not use numbers from SMS, ads or the scammer.'],
h1930:['Call 1930 (India cyber fraud helpline)','Report suspected financial cyber fraud promptly.','Quick reports can help the transaction trail.','Keep transaction details ready.','Do not pay anyone offering to recover money for a fee.'],
portal:['File a complaint at cybercrime.gov.in','Register on the National Cyber Crime Reporting Portal.','Creates an official record.','Type https://cybercrime.gov.in yourself and note the acknowledgement number.','Avoid lookalike sites and links from messages.'],
evid:['Preserve evidence','Save transaction references, messages and screenshots.','Banks and authorities ask for them.','Add them to the Evidence Vault below.','Do not delete chats or reply to the scammer.'],
agents:['Beware of recovery agents','Treat anyone promising recovery for an advance fee as a likely scam.','Victims are often targeted twice.','Deal only with your bank and official authorities.','Do not pay advance fees.'],
pw:['Change compromised passwords','Change them on a trusted device through the official site or app.','Stops access with the old password.','Use a new, unique password and turn on multi-factor authentication.','Do not reuse the old password.'],
sess:['Sign out unknown sessions','Sign out of all devices and unknown connected apps.','Removes anyone still logged in.','Use the official security settings.','Do not approve unfamiliar login prompts.'],
mail:['Secure email and accounts with the same password','Check your email and any account sharing the password.','Email can reset your other accounts.','Change passwords; enable multi-factor authentication.','Do not keep one password everywhere.'],
close:['Close the suspicious page','Close the tab and stop interacting.','Stops further exposure.','Close the tab and clear it from history.','Do not download files or grant permissions.'],
dev:['Secure your device','Remove unknown apps, revoke permissions, run a trusted security scan.','Unwanted apps can watch or control a device.','Use Settings and your phone maker’s official tools.','Do not install “cleaner” apps from links.'],
watch:['Watch for unusual activity','Review login alerts and statements over the coming days.','Problems can appear later.','Check notifications from your bank and email.','Do not assume you are completely safe.'],
wallet:['Follow official wallet guidance','Read your wallet maker’s official documentation on a compromised phrase.','Anyone with the phrase may control the wallet.','Open the official site by typing it yourself.','Never type your phrase anywhere for “help”.'],
move:['Consider moving remaining assets to a newly secured wallet','Only if official guidance supports it, use a fresh wallet on a clean device.','The old wallet stays compromised.','Double-check addresses; blockchain transactions are often irreversible.','Do not rush or use unknown tools.'],
fake:['Avoid fake recovery services','Ignore anyone offering to recover stolen crypto.','These are usually second scams.','Report them to the platform they used.','Never share the phrase or pay fees.'],
sims:['Contact your mobile operator','Ask for SIM blocking and replacement.','SMS codes could otherwise be intercepted.','Use the operator’s official number or store.','Do not share extra details with unverified callers.'],
recover:['Use official account recovery','Start recovery from the service’s official site or app.','It is the safe way back in.','Type the web address yourself.','Do not use recovery links from messages.'],
mfa:['Turn on multi-factor authentication','Enable it wherever available.','Adds protection if a password leaks.','Prefer an authenticator app.','Never share codes.']};
function nextQ(t,a){return Q[t].find(q=>(!q[3]||q[3](a))&&a[q[0]]===undefined)}
function assess(t,a){let r='HIGH',why=[],risk=[],ids=[];
if(t==='money'){r=a.status==='completed'?'CRITICAL':'HIGH';why.push(a.status==='completed'?'The fraudulent transfer was completed.':'The payment is pending, so quick action may still help.');if(a.recent==='Within 1 hour')why.push('It happened within the last hour, so speed matters most.');risk=['Money in your bank account','Linked payment methods'];ids=[a.bank==='yes'?0:'bank','h1930','portal','evid','agents']}
if(t==='otp'){const b=a.acct==='Banking';r=b?(a.act==='yes'||a.acc==='no'?'CRITICAL':'HIGH'):(a.pw==='yes'||(a.acc==='no'&&a.act==='yes')?'CRITICAL':'HIGH');why.push(b?'A banking OTP can authorise payments.':'An OTP can let someone take over the account.');if(a.pw==='yes')why.push('A password was also shared.');if(a.act==='yes')why.push('You noticed unfamiliar activity.');if(a.acc==='no')why.push('You cannot access the account.');risk=['Access to the account',b?'Money in the linked bank account':'Other accounts with the same password'];ids=[b?'bank':0,'pw','sess','mail',b?'h1930':0]}
if(t==='link'){const e=a.entered==='yes';if(e&&a.what==='Bank/card details'){r='CRITICAL';why.push('Bank or card details were entered.');risk=['Bank account','Card']}else if(e){r='HIGH';why.push('Information was entered on a suspicious site.');risk=['The account you used']}else if(a.dl==='yes'||a.perm==='yes'){r='HIGH';why.push('Something was installed or a permission granted.');risk=['Your device and its data']}else{r='CAUTION';why.push('Clicking alone does not necessarily mean compromise, but stay alert.');risk=['Probably nothing, if nothing was entered or installed']}
ids=['close',e?'pw':0,e&&a.what==='Bank/card details'?'bank':0,e&&a.what==='Bank/card details'?'h1930':0,a.dl==='yes'||a.perm==='yes'?'dev':0,r==='CAUTION'?'watch':0]}
if(t==='crypto'){r='CRITICAL';why.push('Anyone with the phrase can control the wallet.');if(a.assets==='yes')why.push('Assets remain in the wallet.');risk=['Everything in the wallet'];ids=['wallet',a.assets==='yes'&&a.acc==='yes'?'move':0,'fake','evid']}
if(t==='sim'){r=a.apps==='yes'?'CRITICAL':'HIGH';why.push(a.apps==='yes'?'Payment apps on the phone could be misused.':'Calls, SMS codes and accounts are exposed.');if(a.lock==='no')why.push('The phone had no screen lock.');risk=['Calls and SMS codes','Apps and accounts on the phone'];ids=[a.blocked==='yes'?0:'sims',a.apps==='yes'?'bank':0,'pw']}
if(t==='hack'){r=a.fin==='yes'?'CRITICAL':'HIGH';why.push(a.fin==='yes'?'The account is linked to payments.':'Account takeover can spread to other accounts.');if(a.reuse==='yes')why.push('The reused password exposes other accounts.');risk=['The account and its data'];ids=['recover','mail','pw','sess','mfa',a.fin==='yes'?'bank':0]}
return{r,why,risk,acts:ids.filter(Boolean)}}
/* ---- Practice scenarios ---- */
const P=[

R.about=()=>`<h1>About PROJECT REWIND</h1><p class=lead><b>Make mistakes. Learn safely. Earn rewards.</b></p>
<div class=card><h2>The problem</h2><p>People often fear digital mistakes because they have no safe place to practise and learn.</p></div>
<div class=card><h2>Our solution</h2><p>Fictional digital simulations, mistake discovery, rewind, rewards, and REWIND RESCUE for when something goes wrong.</p></div>
<h2>Key innovations</h2><div class=grid><div class=card><h3>Mistake Treasure Hunt</h3><p>Find the hidden risks in a fake message.</p></div><div class=card><h3>Rewind and retry</h3><p>Undo a mistake and choose the safer option.</p></div><div class=card><h3>Context-aware REWIND RESCUE</h3><p>Answer a few questions and get a rule-based action plan.</p></div><div class=card><h3>Personal learning insights</h3><p>Goals, patterns and next steps from your own practice.</p></div><div class=card><h3>Accessibility-focused design</h3><p>Large text, high contrast, read aloud and keyboard use.</p></div></div>
<h2>The user journey</h2><div class=flow>${['Practice','Make a mistake','Discover it','Rewind','Master'].map(x=>`<span>${x}</span>`).join('<em>→</em>')}</div><p>Then, if something real goes wrong, REWIND RESCUE gives a calm step-by-step plan.</p>
<h2>Who it is for</h2><ul><li>Elderly people</li><li>First-time digital users</li><li>People with accessibility needs</li><li>Anyone who wants safer digital habits</li></ul>
<h2>Privacy and safety</h2><p class=trust>Everything is a fictional simulation. No real money moves and no real accounts are accessed. The app never asks for passwords, OTPs, PINs or recovery phrases. Progress is saved only in this browser’s local storage, which is not encrypted. Clearing browser data removes it.</p>
<h2>Technology</h2><p>Plain HTML, CSS and JavaScript in a single file. Hash-based navigation. Progress saved with browser local storage. Read Aloud uses the browser’s speech synthesis. No backend, no external libraries, fonts or network requests, and no AI.</p><p><a class=btn href="#demo">Explore Demo</a></p>`;

'Everything is a fictional simulation. No real money moves and no real accounts are accessed. The app never asks for passwords, OTPs, PINs or recovery phrases. Progress is saved only in this browser’s local storage, which is not encrypted. Clearing browser data removes it.':'सब कुछ काल्पनिक सिमुलेशन है। कोई असली पैसा नहीं चलता और कोई असली खाता नहीं खुलता। ऐप कभी पासवर्ड, OTP, पिन या रिकवरी फ़्रेज़ नहीं माँगता। प्रगति केवल इस ब्राउज़र की लोकल स्टोरेज में सहेजी जाती है, जो एन्क्रिप्टेड नहीं है। ब्राउज़र डेटा हटाने पर यह मिट जाती है।','Plain HTML, CSS and JavaScript in a single file. Hash-based navigation. Progress saved with browser local storage. Read Aloud uses the browser’s speech synthesis. No backend, no external libraries, fonts or network requests, and no AI.':'एक ही फ़ाइल में सादा HTML, CSS और JavaScript। हैश आधारित नेविगेशन। प्रगति ब्राउज़र की लोकल स्टोरेज में सहेजी जाती है। पढ़कर सुनाएँ सुविधा ब्राउज़र की स्पीच सिंथेसिस इस्तेमाल करती है। कोई बैकएंड, बाहरी लाइब्रेरी, फ़ॉन्ट या नेटवर्क अनुरोध नहीं, और कोई AI नहीं।',

'The Detail Miss':'विवरण चूकने वाला','In practice, you sometimes overlooked names, amounts or payment details. Slow down and check them.':'अभ्यास में, आपने कभी-कभी नाम, राशि या भुगतान विवरण अनदेखे किए। धीमे चलें और उन्हें जाँचें।','The Trusting Clicker':'भरोसा करके क्लिक करने वाला','In practice, you sometimes trusted suspicious links or messages. Pause before you tap.':'अभ्यास में, आपने कभी-कभी संदिग्ध लिंक या संदेशों पर भरोसा किया। टैप करने से पहले रुकें।','The OTP Risk':'OTP जोखिम','In practice, OTP safety needs more attention.':'अभ्यास में, OTP सुरक्षा पर और ध्यान चाहिए।','Recovery-phrase care':'रिकवरी फ़्रेज़ की देखभाल','In practice, recovery-phrase safety needs more attention.':'अभ्यास में, रिकवरी फ़्रेज़ की सुरक्षा पर और ध्यान चाहिए।','The Fast Tapper':'जल्दी टैप करने वाला','In practice, you often chose within 3 seconds and missed some risks. Read the whole message first.':'अभ्यास में, आपने अक्सर 3 सेकंड में चुना और कुछ जोखिम चूके। पहले पूरा संदेश पढ़ें।','The Careful Checker':'सावधानी से जाँचने वाला','In practice, you regularly chose the safe action.':'अभ्यास में, आपने नियमित रूप से सुरक्षित कदम चुना।','These are learning patterns, not personality tests. They do not predict real-world behaviour.':'ये सीखने के पैटर्न हैं, व्यक्तित्व परीक्षण नहीं। ये असली दुनिया के व्यवहार की भविष्यवाणी नहीं करते।','Your choices in practice show a pattern. Learn it and change what happens next.':'अभ्यास में आपके विकल्प एक पैटर्न दिखाते हैं। उसे समझें और आगे का नतीजा बदलें।',
'Scenarios':'परिदृश्य','Hunt signs':'खोजे संकेत','Milestones':'पड़ाव','Welcome. Mistakes here are safe. That is the whole point.':'स्वागत है। यहाँ गलतियाँ सुरक्षित हैं। यही तो मकसद है।','Missing a risk in practice is how people learn. Rewind and try again whenever you like.':'अभ्यास में कोई जोखिम चूक जाना ही सीखने का तरीका है। जब चाहें रिवाइंड करके फिर कोशिश करें।','You are building good habits. Keep going at your own pace.':'आप अच्छी आदतें बना रहे हैं। अपनी गति से आगे बढ़ते रहें।','Tick a goal to track it. Progress comes only from your saved activity.':'किसी लक्ष्य को ट्रैक करने के लिए टिक करें। प्रगति केवल आपकी सहेजी गतिविधि से आती है।','Simple rules based only on your saved practice. No AI is used.':'केवल आपके सहेजे अभ्यास पर आधारित सरल नियम। कोई AI इस्तेमाल नहीं होता।','Start with the UPI practice':'यूपीआई अभ्यास से शुरू करें','You have no saved practice yet.':'आपका अभी कोई अभ्यास सहेजा नहीं है।','Open UPI practice':'यूपीआई अभ्यास खोलें','You have not completed this scenario yet.':'आपने यह परिदृश्य अभी पूरा नहीं किया है।','Start scenario':'परिदृश्य शुरू करें','No insight yet. Keep practising.':'अभी कोई सुझाव नहीं। अभ्यास करते रहें।','No activity yet.':'अभी कोई गतिविधि नहीं।','Make your first choice in a practice scenario and it will appear here.':'किसी अभ्यास परिदृश्य में पहला विकल्प चुनें और वह यहाँ दिखेगा।','A pattern appears after at least 3 saved decisions.':'कम से कम 3 सहेजे निर्णयों के बाद पैटर्न दिखता है।','No risky practice choices waiting to be replayed.':'दोबारा खेलने के लिए कोई जोखिम भरा विकल्प बाकी नहीं।','Try REWIND RESCUE':'REWIND RESCUE आज़माएँ','Treasure Hunt':'खज़ाना खोज','Open Treasure Hunt':'खज़ाना खोज खोलें',

'Practise everyday digital tasks safely.':'रोज़मर्रा के डिजिटल काम सुरक्षित तरीके से करने का अभ्यास करें।','Discover mistakes before they become costly.':'गलतियों को महँगी पड़ने से पहले पहचानें।','Learn what to do when something goes wrong.':'कुछ गलत होने पर क्या करना है, यह सीखें।','The demo is a guided 5-stage tour. Demo activity is stored apart from your real progress.':'डेमो 5 चरणों वाला गाइडेड टूर है। डेमो की गतिविधि आपकी असली प्रगति से अलग सहेजी जाती है।','Learning Impact':'सीखने का प्रभाव',
'Many people avoid digital services because they fear one wrong tap could cost them money. Without a safe place to practise, the fear grows. PROJECT REWIND is that safe place: every payment, message and emergency here is fictional.':'कई लोग डिजिटल सेवाओं से बचते हैं क्योंकि उन्हें डर रहता है कि एक गलत टैप से पैसे जा सकते हैं। अभ्यास की सुरक्षित जगह के बिना यह डर बढ़ता है। PROJECT REWIND वही सुरक्षित जगह है: यहाँ हर भुगतान, संदेश और आपात स्थिति काल्पनिक है।','Task: pay Ravi Kumar ₹500. In this demo, deliberately pick the similar name “Ravi Kumaar” or the wrong amount. Nothing real is paid.':'काम: Ravi Kumar को ₹500 दें। इस डेमो में जानबूझकर मिलता-जुलता नाम “Ravi Kumaar” या गलत राशि चुनें। कुछ भी असली भुगतान नहीं होता।','The app detects the wrong recipient or amount, explains why it matters, and lets you REWIND. Fixing it earns XP once. Repeating it earns nothing more.':'ऐप गलत प्राप्तकर्ता या राशि पकड़ लेता है, कारण समझाता है, और आपको REWIND करने देता है। सुधारने पर XP एक बार मिलता है। दोहराने पर और नहीं मिलता।','A fictional suspicious payment: completed, UPI, within the last hour, bank not yet contacted. The rule-based engine gives a risk level and an action plan. It is guidance, not a guarantee of recovery.':'एक काल्पनिक संदिग्ध भुगतान: पूरा हो चुका, यूपीआई, पिछले एक घंटे में, बैंक से अभी संपर्क नहीं हुआ। नियम-आधारित इंजन जोखिम स्तर और कार्य योजना देता है। यह मार्गदर्शन है, पैसे वापस मिलने की गारंटी नहीं।','Your progress dashboard, achievements and Mistake DNA are built only from your own practice in demo mode.':'आपका प्रगति डैशबोर्ड, उपलब्धियाँ और Mistake DNA केवल डेमो मोड में आपके अपने अभ्यास से बनते हैं।','Demo entry, deliberately wrong':'डेमो प्रविष्टि, जानबूझकर गलत','The task was Ravi Kumar, ₹500.':'काम था: Ravi Kumar, ₹500।','Press Play to watch a mistake being caught and rewound.':'गलती पकड़े जाने और रिवाइंड होने को देखने के लिए प्ले दबाएँ।','1. You press Pay with “Ravi Kumaar” and ₹5,000.':'1. आप “Ravi Kumaar” और ₹5,000 के साथ भुगतान दबाते हैं।','2. Mistake detected: similar name and the wrong amount.':'2. गलती पकड़ी गई: मिलता-जुलता नाम और गलत राशि।','3. REWIND: back to the choice, with the safer option highlighted.':'3. REWIND: चुनाव पर वापस, सुरक्षित विकल्प चमकता हुआ।','4. Fixed: Ravi Kumar, ₹500. +20 demo XP, first time only.':'4. सुधार: Ravi Kumar, ₹500। +20 डेमो XP, केवल पहली बार।','Demo mode saves progress apart from your real progress. Reset clears only demo data.':'डेमो मोड प्रगति को आपकी असली प्रगति से अलग सहेजता है। रीसेट केवल डेमो डेटा मिटाता है।'};

link:['संदिग्ध लिंक पर क्लिक किया','अनजान नंबर से SMS','काल्पनिक SMS: आपका पार्सल रुका है। ₹29 कस्टम शुल्क दें: http://parcel-india-fee.example/pay','आपने लिंक पर टैप किया और एक पेज खुला जो भुगतान की जानकारी माँग रहा है।','मैंने केवल क्लिक किया। मैं कुछ भी भरे बिना पेज बंद कर देता/देती हूँ','सिर्फ़ क्लिक करने का मतलब यह नहीं कि आपका डिवाइस या खाता ज़रूर खतरे में है।','कुछ भी भरा या इंस्टॉल नहीं हुआ। कुछ दिन अपने खातों पर नज़र रखें।','मैं भुगतान के लिए अपना लॉगिन या कार्ड विवरण भर देता/देती हूँ','नकली पेज पर भरी जानकारी सीधे हमलावर के पास जाती है।','आपकी जानकारी ठग के पास पहुँच सकती है। अगला कदम: पासवर्ड बदलें, कार्ड या बैंक विवरण भरा हो तो बैंक को कॉल करें, फिर 1930 पर कॉल करें।','मैं पेज द्वारा दिया गया ऐप इंस्टॉल कर लेता/लेती हूँ','अनजान ऐप आपकी स्क्रीन देख सकते हैं या संदेश पढ़ सकते हैं।','आपके फ़ोन में अनचाहा ऐप आ सकता है। अगला कदम: उसे हटाएँ, अनुमतियाँ रद्द करें, भरोसेमंद टूल से स्कैन करें और ज़रूरी पासवर्ड बदलें।','पेज बंद करें, कोई जानकारी न भरें, कुछ डाउनलोड न करें, और असामान्य गतिविधि पर नज़र रखें।','कई ठगियाँ तभी सफल होती हैं जब आप कदम उठाते हैं। सिर्फ़ टैप करना आमतौर पर काफ़ी नहीं होता, लेकिन जानकारी भरना या कुछ इंस्टॉल करना नुकसान करता है।','यदि केवल क्लिक किया: टैब बंद करें और खातों पर नज़र रखें।','यदि लॉगिन विवरण भरा: वह पासवर्ड बदलें और दूसरे सेशन से साइन आउट करें।','यदि कार्ड या बैंक विवरण भरा: अपने बैंक और 1930 पर कॉल करें।','यदि कुछ इंस्टॉल किया: उसे हटाएँ, अनुमतियाँ रद्द करें और भरोसेमंद टूल से स्कैन करें।'],

crypto:['रिकवरी फ़्रेज़ उजागर हो गया','वॉलेट चेतावनी (काल्पनिक)','काल्पनिक अलर्ट: वॉलेट वेरिफ़िकेशन ज़रूरी है। एक्सेस बनाए रखने के लिए 1 घंटे में अपना 12 शब्दों का रिकवरी फ़्रेज़ दोबारा डालें।','आपने अलर्ट वाली वेबसाइट में अपना रिकवरी फ़्रेज़ डाल दिया। आपका वॉलेट अभी भी आपके लिए खुलता है।','आपको संदेश भेजने वाले “रिकवरी विशेषज्ञ” को भुगतान करें','फ़र्ज़ी रिकवरी सेवाएँ दूसरी ठगी होती हैं।','वे शुल्क लेकर गायब हो जाते हैं, या और माँगते हैं।','अपने वॉलेट निर्माता के आधिकारिक दस्तावेज़, खुद टाइप करके, पढ़ें और उनके निर्देश मानें','आगे क्या करना है, इसके लिए आधिकारिक दस्तावेज़ सबसे सुरक्षित स्रोत हैं।','आप अपने वॉलेट के लिए सबसे सुरक्षित कदम जानते हैं और अनौपचारिक टूल से बचते हैं।','उसे “सुरक्षित” करने के लिए किसी दूसरी साइट पर फ़्रेज़ डालें','जिस भी साइट को फ़्रेज़ दिखता है, वहाँ चोरी का एक और मौका बनता है।','फ़्रेज़ अब और जगहों पर उजागर हो गया है।','फ़्रेज़ को कहीं भी इस्तेमाल करना बंद करें और समझौता हुए फ़्रेज़ के लिए वॉलेट निर्माता के आधिकारिक निर्देश मानें।','रिकवरी फ़्रेज़ वॉलेट की मास्टर चाबी है। जिसके पास यह है, वह किसी भी डिवाइस से वॉलेट नियंत्रित कर सकता है, और ब्लॉकचेन ट्रांसफ़र अक्सर वापस नहीं होते।','“मदद” के नाम पर अपना फ़्रेज़ कहीं भी साझा या टाइप न करें।','संपत्ति तभी हटाएँ जब आधिकारिक निर्देश इसका समर्थन करें, और साफ़ डिवाइस पर नया वॉलेट इस्तेमाल करें।','शुल्क लेकर चोरी हुई क्रिप्टो वापस दिलाने का दावा करने वालों को अनदेखा करें।','पैसा वापस मिलने का वादा नहीं किया जा सकता। धोखाधड़ी की रिपोर्ट https://cybercrime.gov.in पर करें या 1930 पर कॉल करें।']};

function tr(root){if(S.p.lang!=='hi'||!root)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),L=[];let n;while(n=w.nextNode())L.push(n);L.forEach(n=>{const v=n.nodeValue,t=v.trim();if(!t)return;let r=HI[t];if(!r)for(const[x,y]of RX)if(x.test(t)){r=t.replace(x,y);break}if(r)n.nodeValue=v.replace(t,()=>r)})}

const ACHV=()=>{const s=st(),k=p=>Object.keys(s.rw).filter(x=>x.startsWith(p)),h=k('hunt-').filter(x=>x!=='hunt-all').length,sf=k('p-').filter(x=>x.endsWith('-safe')).length,dn=k('p-').filter(x=>x.endsWith('-done')).length;return[['Alert Mind',h>=1],['Scam Spotter',sf>=3],['Digital Guardian',dn>=5]].filter(a=>a[1]).map(a=>a[0])};
